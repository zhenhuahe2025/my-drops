      const blocks=times.map(time=>{const entries=current.filter(m=>validTimes(m).includes(time)),doneCount=entries.filter(m=>taken[takeKey(scheduleDate,time,m.id)]).length;return `<section class="card schedule-block" data-part="${part(time)}"><div class="schedule-block-head"><span class="period-icon" aria-hidden="true">${icon(time)}</span><div><h2>${displayTime(time)}</h2><p>${part(time)}</p></div><span class="slot-progress">${doneCount}/${entries.length}<br>taken</span></div>${entries.map(m=>{const key=takeKey(scheduleDate,time,m.id),done=!!taken[key],description=m.id==='prednisolone'?`${m.eye} · 1 drop · Week ${courseWeek(scheduleDate)} example`:`${m.eye||'As directed'} · 1 drop`;return `<div class="schedule-medicine"><span class="schedule-thumb" aria-hidden="true">${medicineVisual(m)}</span><div class="schedule-medicine-copy"><strong>${esc(m.name)}</strong><p>${esc(description)}</p></div><button class="take-button${done?' is-taken':''}" data-action="toggle-taken" data-take-key="${esc(key)}" aria-pressed="${done}">${done?'✓ Taken':'□ Mark as taken'}</button></div>`}).join('')}</section>`}).join('');
      const week=courseWeek(scheduleDate),hasPred=current.some(m=>m.id==='prednisolone');
      const coursePanel=hasPred?`<section class="card taper-card"><div class="taper-top"><span class="taper-kicker">PREDNISOLONE · FOUR-WEEK EXAMPLE</span><h2>${week>=1&&week<=4?`Week ${week} <span>of 4</span>`:week<1?'Course not started':'Example course ended'}</h2><p>${week>=1&&week<=4?`For the selected date: ${course.weekly[week-1]} ${Number(course.weekly[week-1])===1?'time':'times'} daily in this editable example.`:'Choose a date within the example course to see a weekly schedule.'}</p></div><div class="week-strip">${course.weekly.map((n,i)=>`<div class="week-pill${week===i+1?' active':''}"><span>WEEK ${i+1}</span><strong>${n}×</strong><small>daily</small></div>`).join('')}</div><details class="course-edit"><summary>Edit the example course</summary><form id="course-form"><label>Course start date<input type="date" name="start" required value="${esc(course.start)}"></label><div class="weekly-inputs">${course.weekly.map((n,i)=>`<label>Week ${i+1}<input type="number" name="week${i+1}" min="0" max="4" value="${n}" required></label>`).join('')}</div><button class="secondary" type="submit">Update example schedule</button></form></details><p class="taper-caution">Sample taper only. The four weekly doses and treated eye must be checked against your own prescription before use.</p></section>`:'';
      const scheduledIds=new Set(current.filter(m=>validTimes(m).length).map(m=>m.id)),other=current.filter(m=>!scheduledIds.has(m.id)&&!(m.id==='prednisolone'&&hasPred));
      return `${heading('My Schedule','A gentler way to see what comes next.') }<div class="schedule-datebar"><span>▣ &nbsp;${dateLabel}</span><input id="schedule-date" type="date" value="${esc(scheduleDate)}" aria-label="Choose schedule date"></div>${coursePanel}<div class="schedule-section-title">TODAY’S PLAN <span>${times.length} times</span></div>${blocks?`<div class="schedule-list">${blocks}</div>`:'<div class="card empty">No timed medicines are listed for this date.</div>'}${other.length?`<h2 class="schedule-group">Other medicines</h2><div class="schedule-list">${other.map(m=>`<section class="card schedule-other"><h3>${esc(m.name)}</h3><p>${esc([m.ingredient,m.type].filter(Boolean).join(' · '))}</p><p>Recorded direction: ${esc(m.dose||'No direction saved.')}</p></section>`).join('')}</div>`:''}<p class="disclaimer">Taken status stays on this device. Confirm every dose, eye and time with your prescription.</p>`
    }
    function settings(){return `${heading('Settings','About this demonstration.')}${info('◉','Sample profile','The displayed name and medicine schedule are illustrative; confirm all entries against your own prescription.')}${info('▣','Saved on this device','Medicines, notes and schedule progress stay in this browser’s local storage. Label photos are read in this browser and are not uploaded. These records may disappear if browser data is cleared.')}${info('◖','Audio support','Read aloud uses your browser’s speech voice. The two Latanoprost explanations use the recordings supplied for this example.')}<p class="disclaimer">Version ${APP_VERSION}</p><button class="secondary" data-action="reset">Reset sample data</button>`}
    function form(kind){
      if(kind==='add')return `${heading('Add a medicine','Scan the prescription label or enter the details.',true)}<section class="card scan-card"><h2>Scan your pharmacy label</h2><button type="button" class="scan-button" data-action="scan-label"><span class="camera-mark" aria-hidden="true">▣</span><span><strong>Take or choose a label photo</strong><small>Use your camera or select a clear image</small></span></button><input id="label-image" type="file" accept="image/*" capture="environment" hidden><p id="scan-status" class="scan-progress" role="status" aria-live="polite">${esc(scanState.message)}</p>${scanPhotoUrl?`<div class="scan-preview"><img src="${esc(scanPhotoUrl)}" alt="Selected prescription label photo"></div>`:''}</section><form class="card form" id="entry-form" data-kind="add"><div class="ocr-review"><h2>Check the details</h2><p>Scanning fills these fields for you. Read them against the prescription label and correct any mistakes before adding.</p>${scanState.text?`<details><summary>Text recognised from the label</summary><textarea readonly rows="5" aria-label="Text recognised from the label">${esc(scanState.text)}</textarea></details>`:''}</div><label>Medicine name<input id="med-name" name="name" maxlength="70" required autocomplete="off" value="${esc(scanState.name)}" placeholder="e.g. Prednisolone acetate"></label><label>Strength (optional)<input name="ingredient" maxlength="50" autocomplete="off" value="${esc(scanState.ingredient)}" placeholder="e.g. 1%"></label><label>Form<input name="type" maxlength="80" required autocomplete="off" value="${esc(scanState.type)}" placeholder="Eye drops, tablets…"></label><label>Directions on the label<input name="dose" maxlength="140" required autocomplete="off" value="${esc(scanState.dose)}" placeholder="Dose and frequency"></label><label>Scheduled times (optional)<input name="times" maxlength="50" autocomplete="off" value="${esc(scanState.times)}" placeholder="08:00, 20:00"></label><label>Expiry month (optional)<input type="month" name="expiry" value="${esc(scanState.expiry)}"></label><label>Status<select name="status" style="font:inherit;padding:11px;border:1px solid #bcd8e8;border-radius:10px;background:white"><option value="current" selected>Current</option><option value="past">Past</option></select></label><button class="primary" type="submit">Add to my medicines</button><p class="helper">Label photos are processed in this browser and are not uploaded. Always verify the medicine and directions; OCR can make mistakes.</p></form>`;
      return `${heading('Add a note','Add a personal note to your journey.',true)}<form class="card form" id="entry-form" data-kind="note"><label>Note<textarea name="text" maxlength="400" required></textarea></label><button class="primary" type="submit">Save note</button><p class="helper">Stored only in this browser.</p></form>`
    }
    function parseLabelText(text){
      const lines=text.split(/\r?\n/).map(line=>line.replace(/[|¦]/g,' ').replace(/\s+/g,' ').trim()).filter(line=>line.length>2);
      const safetyNoise=/\b(patient|pharmacy|street|address|keep out|reach of children|expiry|expires|batch|lot no|prescription only|date dispensed|store below|discard after)\b/i;
      const uiWords=/\b(?:add a medicine|scan(?: the)? pharmacy label|scan label|search medicine|find and add manually|enter barcode|my drops|your medicines|home|learn|journey|settings|current medicines|past medicines|medicine name|add to my medicines|choose how to add your medicine|take or choose a label photo|frequency|form|directions on the label)\b/gi;
      const strengthPattern=/\d+(?:[.,]\d+)?\s*(?:mg\s*\/\s*ml|mcg\s*\/\s*ml|µg\s*\/\s*ml|%|mg|mcg|µg|g)/i;
      const cleanLine=line=>line.replace(uiWords,' ').replace(safetyNoise,' ').replace(/[^a-z0-9µ%./+ -]/gi,' ').replace(/\s+/g,' ').trim();
      const productCandidates=lines.filter(line=>strengthPattern.test(line)&&!safetyNoise.test(line)).map(line=>{let clean=cleanLine(line);const instructionAt=clean.search(/\b(?:put|take|apply|instil|instill|use|one|two|\d+)\s+(?:one\s+)?(?:drops?|tablets?|capsules?)\b/i);if(instructionAt>0)clean=clean.slice(0,instructionAt).trim();const longCaps=(clean.match(/\b[A-Z]{7,}\b/g)||[]).length;const oddRuns=(clean.match(/\b(?:[A-Za-z]{2,4}\s+){3,}[A-Za-z]{2,4}\b/g)||[]).length;return {line:clean,score:24-Math.abs(clean.length-24)*.08-longCaps*7-oddRuns*3-(clean.length>60?12:0)}}).filter(c=>strengthPattern.test(c.line)).sort((a,b)=>b.score-a.score);
      const product=productCandidates[0]?.line||lines.map(cleanLine).find(line=>/[a-z]{3}/i.test(line)&&line.length<70)||'';
      const strength=product.match(strengthPattern)?.[0]?.replace(/\s+/g,' ')||'';
      const name=product.replace(strengthPattern,'').replace(/\b\d+(?:[.,]\d+)?\s*(?:ml|mL)\b/i,'').replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi,'').trim();
      const type=/\b(eye drops?|ophthalmic)\b|\bdrops?\s+in\s+(?:each|both|the)\s+eyes?\b/i.test(text)?'Eye drops':/\btablets?\b/i.test(text)?'Tablets':/\bcapsules?\b/i.test(text)?'Capsules':'Medicine';
      const clinical=lines.map(line=>cleanLine(line)).filter(line=>line&&!/^\d{1,2}:\d{2}(?:\s+\d{1,2}:\d{2})*$/.test(line));
      const actionPattern=/\b(?:put|take|apply|instil|instill|use)\b/i,amountPattern=/\b(?:one|two|three|four|\d+)\s*(?:drops?|tablets?|capsules?)\b/i;
      const actionLine=clinical.find(line=>actionPattern.test(line)&&amountPattern.test(line));
      const amountLine=clinical.find(line=>amountPattern.test(line)&&/\b(?:eye|mouth|daily|day|times|both|each|once|twice)\b/i.test(line));
      const frequencyPattern=/\b(?:once|twice|(?:three|four|[1-4]) times)(?:\s+(?:a|per) day|\s+daily)?\b/i;
      const frequencyLine=clinical.map(line=>line.match(frequencyPattern)?.[0]).find(Boolean)||'';
      let directive='';
      if(actionLine){const match=actionLine.match(/\b(?:put|take|apply|instil|instill|use)\b.{0,100}/i);directive=match?.[0]?.trim()||''}
      else if(amountLine){const match=amountLine.match(/\b(?:one|two|three|four|\d+)\s*(?:drops?|tablets?|capsules?)\b.{0,70}/i);directive=match?.[0]?.trim()||''}
      let dose=[directive,frequencyLine&&!directive.toLowerCase().includes(frequencyLine.toLowerCase())?frequencyLine:''].filter(Boolean).join(' ').replace(/\s+/g,' ').slice(0,140);
      const times=[...new Set(lines.filter(line=>/(?:put|take|apply|instil|instill|drop|tablet|daily|schedule|\bat\b)/i.test(line)&&!safetyNoise.test(line)).flatMap(line=>line.match(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g)||[]))].join(', ');
      return {name,ingredient:strength,type,dose,times,text};
    }
    function cameraSupportsTorch(){try{return !!cameraStream?.getVideoTracks?.()[0]?.getCapabilities?.().torch}catch{return false}}
    function stopBottleCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}torchEnabled=false}
    async function startBottleCamera(){
      if(!navigator.mediaDevices?.getUserMedia){cameraMessage='Live camera is not available here. Choose a bottle photo instead.';render();return}
      cameraMessage='Starting the rear camera…';const status=document.getElementById('camera-status');if(status)status.textContent=cameraMessage;
      try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1600}},audio:false});if(route!=='scan'){stream.getTracks().forEach(track=>track.stop());return}stopBottleCamera();cameraStream=stream;cameraMessage='Center the bottle label inside the frame.';const video=document.getElementById('bottle-video');if(video)video.srcObject=cameraStream;const currentStatus=document.getElementById('camera-status');if(currentStatus)currentStatus.textContent=cameraMessage;const flash=document.querySelector('[data-action="toggle-flash"]');if(flash)flash.disabled=!cameraSupportsTorch()}
      catch{cameraMessage='Camera access is unavailable. Choose a bottle photo to continue.';render()}
    }
    function captureBottlePhoto(){
      const video=document.getElementById('bottle-video');if(!cameraStream||!video||video.readyState<2){document.getElementById('bottle-image')?.click();return}
      const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const context=canvas.getContext('2d');if(!context){document.getElementById('bottle-image')?.click();return}context.drawImage(video,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob){cameraMessage='Could not capture the photo. Try choosing an image instead.';const status=document.getElementById('camera-status');if(status)status.textContent=cameraMessage;return}const file=new File([blob],`my-drops-bottle-${Date.now()}.jpg`,{type:'image/jpeg'});stopBottleCamera();void scanPrescriptionLabel(file)},'image/jpeg',.92)
    }
    async function toggleBottleFlash(){if(!cameraSupportsTorch())return;try{torchEnabled=!torchEnabled;await cameraStream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchEnabled}]});const button=document.querySelector('[data-action="toggle-flash"]');if(button)button.setAttribute('aria-pressed',String(torchEnabled));cameraMessage=torchEnabled?'Flash is on. Center the label in the frame.':'Flash is off.';const status=document.getElementById('camera-status');if(status)status.textContent=cameraMessage}catch{cameraMessage='Flash is not supported by this camera.';const status=document.getElementById('camera-status');if(status)status.textContent=cameraMessage}}
    function prepareLabelForOcr(file){
      return new Promise((resolve,reject)=>{
        const image=new Image(),sourceUrl=URL.createObjectURL(file),cleanup=()=>URL.revokeObjectURL(sourceUrl);
        image.onload=()=>{try{const width=image.naturalWidth,height=image.naturalHeight;if(!width||!height)throw new Error('The label image could not be opened.');const scale=Math.min(1,2000/Math.max(width,height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));const context=canvas.getContext('2d');if(!context)throw new Error('The label image could not be prepared.');context.drawImage(image,0,0,canvas.width,canvas.height);const dataUrl=canvas.toDataURL('image/jpeg',.92);cleanup();resolve(dataUrl)}catch(error){cleanup();reject(error)}};
        image.onerror=()=>{cleanup();reject(new Error('The label image could not be opened. Try another photo.'))};image.src=sourceUrl
      })
    }
    function loadOcrEngine(){
      if(window.Tesseract?.createWorker)return Promise.resolve(window.Tesseract);
      return new Promise((resolve,reject)=>{let script=document.getElementById('tesseract-engine');if(script){script.addEventListener('load',()=>resolve(window.Tesseract),{once:true});script.addEventListener('error',()=>reject(new Error('The label reader could not load.')),{once:true});return}script=document.createElement('script');script.id='tesseract-engine';script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=()=>resolve(window.Tesseract);script.onerror=()=>{script.remove();reject(new Error('The label reader could not load. Check your connection or enter the details manually.'))};document.head.appendChild(script)})
    }
    async function scanPrescriptionLabel(file){
      const token=++scanToken;if(scanPhotoUrl)URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=URL.createObjectURL(file);scanState={...scanState,text:'',name:'',ingredient:'',type:'Eye drops',dose:'',times:'',message:'Loading the on-device label reader…'};render();let worker;
      try{const ocrImage=await prepareLabelForOcr(file);if(token!==scanToken)return;const engine=await loadOcrEngine();if(token!==scanToken)return;worker=await engine.createWorker('eng',1,{logger:message=>{if(token===scanToken&&message.status==='recognizing text'){const status=document.getElementById('scan-status')||document.getElementById('camera-status');if(status)status.textContent=`Reading the label… ${Math.round((message.progress||0)*100)}%`}}});const result=await worker.recognize(ocrImage);if(token!==scanToken)return;scanState={...parseLabelText(result.data.text||''),message:result.data.text?.trim()?(route==='scan'?'Bottle scan complete. Open Bigger view to enlarge the label and hear the medicine name and dose.':'Check the recognised text and fields before adding.'):'No text was recognised. Try a clearer photo or enter the details manually.'};render()}catch(error){if(token===scanToken){scanState={...scanState,message:error?.message||'Could not read that photo. You can enter the details manually.'};render()}}finally{if(worker)try{await worker.terminate()}catch{}}
    }
    function render(){const views={home,detail,magnify,scan,timeline:journey,schedule,settings,add:()=>form('add'),note:()=>form('note')};app.innerHTML=(views[route]||home)();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.route===route?'page':'false'));window.scrollTo({top:0,behavior:'instant'})}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route==='scan'){stopBottleCamera();if(scanPhotoUrl){URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=''}scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Starting the bottle scan…'};magnifyFromScan=false;route='scan';cameraMessage='Starting the rear camera…';render();void startBottleCamera();return}if(b.dataset.route){stopBottleCamera();magnifyFromScan=false;route=b.dataset.route;render();return}if(b.dataset.med){selected=b.dataset.med;tab='overview';route='detail';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.action==='scan-label'){document.getElementById('label-image')?.click();return}if(b.dataset.action==='capture-bottle'){captureBottlePhoto();return}if(b.dataset.action==='browse-bottle-photo'){document.getElementById('bottle-image')?.click();return}if(b.dataset.action==='toggle-flash'){void toggleBottleFlash();return}if(b.dataset.action==='open-scan-magnify'){magnifyFromScan=true;stopBottleCamera();route='magnify';render();return}if(b.dataset.action==='retake-bottle'){if(scanPhotoUrl)URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl='';scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Starting the bottle scan…'};route='scan';cameraMessage='Starting the rear camera…';render();void startBottleCamera();return}if(b.dataset.action==='toggle-taken'){const key=b.dataset.takeKey;if(key){taken[key]=!taken[key];localStorage.setItem('mydrops.taken',JSON.stringify(taken));render()}return}if(b.dataset.action==='back'){if(route==='magnify'){route=magnifyFromScan?'scan':'detail';magnifyFromScan=false}else if(route==='scan'){stopBottleCamera();route='home'}else route=route==='note'?'timeline':'home';render()}if(b.dataset.action==='zoomin'||b.dataset.action==='zoomout'){zoom=Math.max(.8,Math.min(1.55,zoom+(b.dataset.action==='zoomin'?.15:-.15)));render()}if(b.dataset.action==='speak'){const m=meds.find(x=>x.id===selected);const scanned=magnifyFromScan&&scanState.name?`${scanState.name}${scanState.ingredient?` ${scanState.ingredient}`:''}. ${scanState.dose||'Check the dose on your prescription label.'}`:'';const text=scanned||(m?`${m.name}. ${m.type}. Recorded schedule: ${m.dose}. Follow your own prescription.`:'');if('speechSynthesis'in window&&text){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-GB';utterance.rate=.85;speechSynthesis.speak(utterance)}else alert('Read aloud is unavailable or no medicine name was recognised.')}if(b.dataset.action==='reset'){if(confirm('Reset added medicines and notes on this device?')){localStorage.removeItem('mydrops.medicines');localStorage.removeItem('mydrops.notes');localStorage.removeItem('mydrops.taken');localStorage.removeItem('mydrops.pred-course');course={start:offsetDate(localDate(),-14),weekly:[4,3,2,1]};meds=initial.map(m=>({...m}));notes=[];taken={};route='home';render()}}});
    document.addEventListener('change',e=>{if(e.target.id==='schedule-date'){scheduleDate=e.target.value||localDate();render();return}if(e.target.id==='label-image'||e.target.id==='bottle-image'){const file=e.target.files?.[0];if(file){stopBottleCamera();void scanPrescriptionLabel(file)}}});
    document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);if(e.target.dataset.kind==='add'){const name=String(data.get('name')).trim(),type=String(data.get('type')).trim(),dose=String(data.get('dose')).trim(),status=String(data.get('status')||'current'),times=[...new Set((String(data.get('times')||'').match(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g)||[]))],medicine={id:'user-'+Date.now(),name,ingredient:String(data.get('ingredient')||'').trim(),type,dose,expiry:String(data.get('expiry')||''),kind:/\b(tablets?|capsules?|pills?)\b/i.test(type)?'pill':'blue',status};if(times.length)medicine.times=times;if(/\bright eye\b/i.test(dose))medicine.eye='Right eye';else if(/\bleft eye\b/i.test(dose))medicine.eye='Left eye';else if(/\b(both eyes|each eye)\b/i.test(dose))medicine.eye='Both eyes';meds.push(medicine);localStorage.setItem('mydrops.medicines',JSON.stringify(meds));filter=status;scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Take a clear photo or choose an image. Scanning runs on this device.'};if(scanPhotoUrl){URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=''}route='home'}else{notes.push({date:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date()),text:String(data.get('text')).trim()});localStorage.setItem('mydrops.notes',JSON.stringify(notes));route='timeline'}render()});

    document.addEventListener('submit',e=>{if(e.target.id!=='course-form')return;e.preventDefault();const data=new FormData(e.target),weekly=[1,2,3,4].map(i=>Math.max(0,Math.min(4,Number(data.get(`week${i}`))||0)));course={start:String(data.get('start')),weekly};localStorage.setItem('mydrops.pred-course',JSON.stringify(course));render()});
    document.addEventListener('submit',e=>{if(e.target.id!=='expiry-form')return;e.preventDefault();const m=meds.find(x=>x.id===selected);if(!m)return;m.expiry=String(new FormData(e.target).get('expiry')||'');localStorage.setItem('mydrops.medicines',JSON.stringify(meds));render()});
    document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
    render();
  })();
