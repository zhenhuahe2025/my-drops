    function parseLabelText(text){
      const lines=text.split(/\r?\n/).map(line=>line.replace(/[|¦]/g,' ').replace(/\s+/g,' ').trim()).filter(line=>line.length>2);
      const safetyNoise=/\b(patient|pharmacy|street|address|keep out|reach of children|expiry|expires|batch|lot no|prescription only|date dispensed|store below|discard after)\b/i;
      const uiWords=/\b(?:add a medicine|scan(?: the)? pharmacy label|scan label|search medicine|find and add manually|enter barcode|my drops|your medicines|home|learn|journey|settings|current medicines|past medicines|medicine name|add to my medicines|choose how to add your medicine|take or choose a label photo|frequency|form|directions on the label)\b/gi;
      const strengthPattern=/\d+(?:[.,]\d+)?\s*(?:mg\s*\/\s*ml|mcg\s*\/\s*ml|µg\s*\/\s*ml|%|mg|mcg|µg|g)/i;
      const cleanLine=line=>line.replace(uiWords,' ').replace(safetyNoise,' ').replace(/[^a-z0-9µ%./+ -]/gi,' ').replace(/\s+/g,' ').trim();
      const productCandidates=lines.filter(line=>strengthPattern.test(line)&&!safetyNoise.test(line)).map(line=>{let clean=cleanLine(line);const instructionAt=clean.search(/\b(?:put|take|apply|instil|instill|use|one|two|\d+)\s+(?:one\s+)?(?:drops?|tablets?|capsules?)\b/i);if(instructionAt>0)clean=clean.slice(0,instructionAt).trim();const longCaps=(clean.match(/\b[A-Z]{7,}\b/g)||[]).length;const oddRuns=(clean.match(/\b(?:[A-Za-z]{2,4}\s+){3,}[A-Za-z]{2,4}\b/g)||[]).length;return {line:clean,score:24-Math.abs(clean.length-24)*.08-longCaps*7-oddRuns*3-(clean.length>60?12:0)}}).filter(c=>strengthPattern.test(c.line)).sort((a,b)=>b.score-a.score);
      const product=productCandidates[0]?.line||lines.map(cleanLine).find(line=>/[a-z]{3}/i.test(line)&&line.length<70)||'';
      const strength=product.match(strengthPattern)?.[0]?.replace(/\s+/g,' ')||'';
      const name=product.replace(strengthPattern,'').replace(/\b\d+(?:[.,]\d+)?\s*(?:ml|mL)\b/i,'').replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi,'').trim();
      const type=/\b(eye drops?|ophthalmic)\b|\bdrops?\s+in\s+(?:each|both|the)\s+eyes?\b/i.test(text)?'Eye drops':/\btablets?\b/i.test(text)?'Tablets':/\bcapsules?\b/i.test(text)?'Capsules':'Medicine';
      const clinical=lines.map(line=>cleanLine(line)).filter(line=>line&&!/^\d{1,2}:\d{2}(?:\s+\d{1,2}:\d{2})*$/.test(line));
      const actionPattern=/\b(?:put|take|apply|instil|instill|use)\b/i,amountPattern=/\b(?:one|two|three|four|\d+)\s*(?:drops?|tablets?|capsules?)\b/i;
      const actionLine=clinical.find(line=>actionPattern.test(line)&&amountPattern.test(line));
      const amountLine=clinical.find(line=>amountPattern.test(line)&&/\b(?:eye|mouth|daily|day|times|both|each|once|twice)\b/i.test(line));
      const frequencyPattern=/\b(?:once|twice|(?:three|four|[1-4]) times)(?:\s+(?:a|per) day|\s+daily)?\b/i;
      const frequencyLine=clinical.map(line=>line.match(frequencyPattern)?.[0]).find(Boolean)||'';
      let directive='';
      if(actionLine){const match=actionLine.match(/\b(?:put|take|apply|instil|instill|use)\b.{0,100}/i);directive=match?.[0]?.trim()||''}
      else if(amountLine){const match=amountLine.match(/\b(?:one|two|three|four|\d+)\s*(?:drops?|tablets?|capsules?)\b.{0,70}/i);directive=match?.[0]?.trim()||''}
      let dose=[directive,frequencyLine&&!directive.toLowerCase().includes(frequencyLine.toLowerCase())?frequencyLine:''].filter(Boolean).join(' ').replace(/\s+/g,' ').slice(0,140);
      const times=[...new Set(lines.filter(line=>/(?:put|take|apply|instil|instill|drop|tablet|daily|schedule|\bat\b)/i.test(line)&&!safetyNoise.test(line)).flatMap(line=>line.match(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g)||[]))].join(', ');
      return {name,ingredient:strength,type,dose,times,text};
    }

    function loadOcrEngine(){
      if(window.Tesseract?.createWorker)return Promise.resolve(window.Tesseract);
      return new Promise((resolve,reject)=>{let script=document.getElementById('tesseract-engine');if(script){script.addEventListener('load',()=>resolve(window.Tesseract),{once:true});script.addEventListener('error',()=>reject(new Error('The label reader could not load.')),{once:true});return}script=document.createElement('script');script.id='tesseract-engine';script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=()=>resolve(window.Tesseract);script.onerror=()=>{script.remove();reject(new Error('The label reader could not load. Check your connection or enter the details manually.'))};document.head.appendChild(script)})
    }
    async function scanPrescriptionLabel(file){
      const token=++scanToken;if(scanPhotoUrl)URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=URL.createObjectURL(file);scanState={...scanState,text:'',name:'',ingredient:'',type:'Eye drops',dose:'',times:'',message:'Loading the on-device label reader…'};render();let worker;
      try{const ocrImage=await prepareLabelForOcr(file);if(token!==scanToken)return;const engine=await loadOcrEngine();if(token!==scanToken)return;worker=await engine.createWorker('eng',1,{logger:message=>{if(token===scanToken&&message.status==='recognizing text'){const status=document.getElementById('scan-status')||document.getElementById('camera-status');if(status)status.textContent=`Reading the label… ${Math.round((message.progress||0)*100)}%`}}});const result=await worker.recognize(ocrImage);if(token!==scanToken)return;scanState={...parseLabelText(result.data.text||''),message:result.data.text?.trim()?(route==='scan'?'Bottle scan complete. Open Bigger view to enlarge the label and hear the medicine name and dose.':'Check the recognised text and fields before adding.'):'No text was recognised. Try a clearer photo or enter the details manually.'};render()}catch(error){if(token===scanToken){scanState={...scanState,message:error?.message||'Could not read that photo. You can enter the details manually.'};render()}}finally{if(worker)try{await worker.terminate()}catch{}}
    }
    function render(){const views={home,detail,magnify,scan,timeline:journey,schedule,settings,add:()=>form('add'),note:()=>form('note')};app.innerHTML=(views[route]||home)();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.route===route?'page':'false'));if(route==='detail'&&recordingBlob)voiceState('Recording ready to send or save.',false,true);if(route==='detail'&&recorder?.state==='recording')voiceState('Recording… tap Stop when finished.',true);window.scrollTo({top:0,behavior:'instant'})}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route==='scan'){stopBottleCamera();if(scanPhotoUrl){URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=''}scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Starting the bottle scan…'};magnifyFromScan=false;route='scan';cameraMessage='Starting the rear camera…';render();void startBottleCamera();return}if(b.dataset.route){stopBottleCamera();magnifyFromScan=false;route=b.dataset.route;render();return}if(b.dataset.med){selected=b.dataset.med;tab='overview';route='detail';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.action==='scan-label'){document.getElementById('label-image')?.click();return}if(b.dataset.action==='capture-bottle'){captureBottlePhoto();return}if(b.dataset.action==='browse-bottle-photo'){document.getElementById('bottle-image')?.click();return}if(b.dataset.action==='toggle-flash'){void toggleBottleFlash();return}if(b.dataset.action==='open-scan-magnify'){magnifyFromScan=true;stopBottleCamera();route='magnify';render();return}if(b.dataset.action==='retake-bottle'){if(scanPhotoUrl)URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl='';scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Starting the bottle scan…'};route='scan';cameraMessage='Starting the rear camera…';render();void startBottleCamera();return}if(b.dataset.action==='toggle-taken'){const key=b.dataset.takeKey;if(key){taken[key]=!taken[key];localStorage.setItem('mydrops.taken',JSON.stringify(taken));render()}return}if(b.dataset.action==='back'){if(route==='magnify'){route=magnifyFromScan?'scan':'detail';magnifyFromScan=false}else if(route==='scan'){stopBottleCamera();route='home'}else route=route==='note'?'timeline':'home';render()}if(b.dataset.action==='zoomin'||b.dataset.action==='zoomout'){zoom=Math.max(.8,Math.min(1.55,zoom+(b.dataset.action==='zoomin'?.15:-.15)));render()}if(b.dataset.action==='speak'){const m=meds.find(x=>x.id===selected);const scanned=magnifyFromScan&&scanState.name?`${scanState.name}${scanState.ingredient?` ${scanState.ingredient}`:''}. ${scanState.dose||'Check the dose on your prescription label.'}`:'';const text=scanned||(m?`${m.name}. ${m.type}. Recorded schedule: ${m.dose}. Follow your own prescription.`:'');if('speechSynthesis'in window&&text){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-GB';utterance.rate=.85;speechSynthesis.speak(utterance)}else alert('Read aloud is unavailable or no medicine name was recognised.')}if(b.dataset.action==='reset'){if(confirm('Reset added medicines and notes on this device?')){localStorage.removeItem('mydrops.medicines');localStorage.removeItem('mydrops.notes');localStorage.removeItem('mydrops.taken');meds=initial.map(m=>({...m}));notes=[];taken={};route='home';render()}}});
    document.addEventListener('change',e=>{if(e.target.id==='schedule-date'){scheduleDate=e.target.value||localDate();render();return}if(e.target.id==='label-image'||e.target.id==='bottle-image'){const file=e.target.files?.[0];if(file){stopBottleCamera();void scanPrescriptionLabel(file)}}});
    document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);if(e.target.dataset.kind==='add'){const name=String(data.get('name')).trim(),type=String(data.get('type')).trim(),dose=String(data.get('dose')).trim(),status=String(data.get('status')||'current'),times=[...new Set((String(data.get('times')||'').match(/\b(?:[01]?\d|2[0-3]):[0-5]\d\b/g)||[]))],medicine={id:'user-'+Date.now(),name,ingredient:String(data.get('ingredient')||'').trim(),type,dose,expiry:String(data.get('expiry')||''),kind:/\b(tablets?|capsules?|pills?)\b/i.test(type)?'pill':'blue',status};if(times.length)medicine.times=times;if(/\bright eye\b/i.test(dose))medicine.eye='Right eye';else if(/\bleft eye\b/i.test(dose))medicine.eye='Left eye';else if(/\b(both eyes|each eye)\b/i.test(dose))medicine.eye='Both eyes';meds.push(medicine);localStorage.setItem('mydrops.medicines',JSON.stringify(meds));filter=status;scanState={name:'',ingredient:'',type:'Eye drops',dose:'',times:'',text:'',message:'Take a clear photo or choose an image. Scanning runs on this device.'};if(scanPhotoUrl){URL.revokeObjectURL(scanPhotoUrl);scanPhotoUrl=''}route='home'}else{notes.push({date:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date()),text:String(data.get('text')).trim()});localStorage.setItem('mydrops.notes',JSON.stringify(notes));route='timeline'}render()});

    let recorder=null,recordingChunks=[],recordingBlob=null,recordingStream=null;
    const voiceState=(message,recording=false,ready=false)=>{const panel=app.querySelector('.voice-panel');if(!panel)return;panel.querySelector('.voice-status').textContent=message;panel.querySelector('[data-action="record-start"]').disabled=recording;panel.querySelector('[data-action="record-stop"]').disabled=!recording;panel.querySelector('[data-action="record-share"]').disabled=!ready};
    document.addEventListener('click',async e=>{const action=e.target.closest('button')?.dataset.action;if(action==='record-start'){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){voiceState('Recording is unavailable in this browser.');return}try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recordingChunks=[];recordingBlob=null;recorder=new MediaRecorder(recordingStream);recorder.ondataavailable=ev=>{if(ev.data.size)recordingChunks.push(ev.data)};recorder.onstop=()=>{recordingBlob=new Blob(recordingChunks,{type:recorder.mimeType||'audio/webm'});recordingStream.getTracks().forEach(track=>track.stop());recordingStream=null;voiceState(recordingBlob.size?'Recording ready to send or save.':'No audio captured.',false,recordingBlob.size>0)};recorder.start();voiceState('Recording… tap Stop when finished.',true)}catch{voiceState('Microphone access was unavailable. Check your browser permission.')}}if(action==='record-stop'&&recorder?.state==='recording'){recorder.stop();voiceState('Preparing recording…')}if(action==='record-share'&&recordingBlob){const ext=recordingBlob.type.includes('mp4')?'m4a':'webm',file=new File([recordingBlob],`MyDrops-voice-note.${ext}`,{type:recordingBlob.type});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'My Drops voice note'});voiceState('Share sheet closed. You choose the recipient.',false,true);return}}catch(err){if(err.name==='AbortError'){voiceState('Sharing cancelled. The recording is still ready.',false,true);return}}const url=URL.createObjectURL(recordingBlob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);voiceState('Audio downloaded. You can attach it in your preferred app.',false,true)}});
    document.addEventListener('submit',e=>{if(e.target.id!=='expiry-form')return;e.preventDefault();const m=meds.find(x=>x.id===selected);if(!m)return;m.expiry=String(new FormData(e.target).get('expiry')||'');localStorage.setItem('mydrops.medicines',JSON.stringify(meds));render()});
    document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
    render();
  })();
  </script>
