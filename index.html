<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5fbff">
  <meta name="description" content="A mobile-friendly demonstration of clear eye medicine information.">
  <title>My Drops — Your eye medicines, made clearer</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102765;background:#edf6fb;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #00a8b1;outline-offset:2px}
    .site{max-width:490px;min-height:100dvh;margin:auto;background:linear-gradient(155deg,#fff 0%,#f5fbff 60%,#eff9fb 100%);box-shadow:0 12px 60px #124e7820;position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
    header{padding:22px 22px 12px;display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:55px;flex:none}.brand-name{font-size:28px;font-weight:850;letter-spacing:-1.5px;line-height:1}.tagline{font-size:12px;color:#466398;margin-top:4px}.headline{padding:17px 22px 9px}.headline h1{font-size:27px;line-height:1.16;letter-spacing:-.8px;margin:0 0 5px}.headline p,.subtle{color:#496aa4;margin:0;line-height:1.4}.eyebrow{color:#0072d9;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
    main{padding:0 18px}.notice{padding:10px 13px;border:1px solid #cde9f1;border-radius:14px;background:#effafd;color:#326286;font-size:12px;line-height:1.4;margin:9px 4px 15px}
    .segmented{display:flex;background:#e8f1fa;padding:4px;border-radius:15px;margin:8px 4px 12px}.segmented button{border:0;background:transparent;color:#3c5d97;border-radius:12px;padding:10px 6px;flex:1;font-weight:700;font-size:14px}.segmented button[aria-selected=true]{background:#0766df;color:white;box-shadow:0 3px 8px #065bcb36}
    .stack{display:grid;gap:10px}.card{border:1px solid #e0edf7;border-radius:18px;background:#fff;box-shadow:0 4px 16px #275a7710}.medicine{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border:1px solid #e0edf7;color:inherit}.medicine.featured{background:#f5fcff;border-color:#b8defa}.medicine .copy{flex:1;min-width:0}.medicine strong{display:block;font-size:18px;letter-spacing:-.35px}.medicine .copy span{display:block;font-size:14px;color:#496aa4;line-height:1.35}.chevron{color:#0865db;font-size:30px;line-height:1}.pill-icon{font-size:31px;width:56px;text-align:center;color:#0a6bd9}.bottle{width:55px;height:80px;flex:none}.bottle.large{width:180px;height:275px;filter:drop-shadow(0 14px 13px #14376331)}
    .add,.primary,.secondary{border-radius:16px;border:0;font-weight:750}.add{width:100%;padding:15px;background:#e3f1fd;color:#0865d5;font-size:16px}.primary{background:#0868df;color:white;padding:13px 18px}.secondary{background:#e6f3ff;color:#075fc9;padding:12px 15px}.action-row{display:flex;gap:10px;margin:12px 0}.action-row>*{flex:1}.back{border:0;background:none;color:#0867d8;padding:7px 0;font-size:16px;display:flex;align-items:center;gap:4px}.back span{font-size:25px;line-height:15px}.detail-head{display:flex;gap:14px;align-items:center;margin:10px 0 13px}.detail-head .bottle{width:83px;height:118px}.detail-head h1{font-size:25px;line-height:1.05;letter-spacing:-.8px;margin:0 0 5px}.detail-head p{color:#496aa4;margin:0 0 8px;font-size:15px}.badge{display:inline-flex;align-items:center;border-radius:30px;background:#daf8f2;color:#126f76;padding:7px 11px;font-size:13px;font-weight:650}
    .tabs{display:flex;gap:5px;margin:12px 0}.tabs button{flex:1;padding:10px 5px;border-radius:12px;background:#eaf3fb;color:#305993;border:0;font-size:13px;font-weight:700}.tabs button[aria-selected=true]{background:#0868df;color:white}.info{display:flex;gap:13px;padding:16px;margin:10px 0}.info-icon{width:46px;height:46px;flex:none;border-radius:50%;background:#e3f3ff;color:#0868df;display:grid;place-items:center;font-size:25px}.info h2{font-size:16px;line-height:1.25;margin:0 0 4px}.info p{font-size:14px;color:#4c6ba2;line-height:1.48;margin:0}.disclaimer{font-size:12px;color:#59729d;line-height:1.5;margin:17px 4px}
    .hero-bottle{height:330px;display:grid;place-items:center}.zoom{display:flex;justify-content:center;gap:14px;margin-bottom:12px}.zoom button{min-width:65px}.zoom-output{overflow:auto;max-height:360px;border-radius:18px;background:#eef9ff;display:grid;place-items:center}.zoom-output .bottle{transition:transform .2s;transform:scale(var(--zoom));margin:22px}.read-box{display:flex;align-items:center;gap:14px;padding:16px}.read-box .round{width:56px;height:56px;flex:none;border:0;border-radius:50%;background:#0868df;color:#fff;font-size:26px}.read-box strong{font-size:16px}.read-box p{font-size:13px;color:#4a69a1;margin:4px 0 0}
    .timeline{border-left:3px solid #0b70e7;margin:18px 0 16px 14px;padding-left:20px;display:grid;gap:13px}.event{padding:14px 16px;position:relative}.event:before{content:"";width:17px;height:17px;border-radius:50%;background:#0868df;border:3px solid #fff;position:absolute;left:-33px;top:19px;box-shadow:0 0 0 1px #d6eaff}.event time{font-weight:800;font-size:14px}.event h2{font-size:17px;line-height:1.25;margin:4px 0 2px}.event p{font-size:14px;color:#4c6ba2;margin:0}.reason{margin-top:10px;display:flex;gap:8px;align-items:baseline;color:#4b69a1;font-size:12px}.reason b{background:#e9f5fc;color:#0a60cb;border-radius:8px;padding:5px 7px;flex:none}
    .form{padding:16px;display:grid;gap:12px}.form h2{margin:0;font-size:19px}.form label{display:grid;gap:5px;font-weight:700;font-size:13px}.form input,.form textarea{width:100%;border:1px solid #bcd8e8;border-radius:10px;background:white;padding:11px 12px;color:#102765;font-size:16px}.form textarea{min-height:90px;resize:vertical}.form .primary{width:100%}.empty{text-align:center;color:#4b6aa0;padding:35px 16px}.helper{font-size:12px;color:#59729d;margin:3px 0 0;line-height:1.45}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,490px);display:flex;background:#ffffffed;border-top:1px solid #d7e8f6;box-shadow:0 -4px 20px #28567312;padding:8px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:3}nav button{flex:1;border:0;background:transparent;color:#58719e;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px}nav button[aria-current=page]{color:#0766dc;font-weight:800}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:360px){header{padding:17px 18px 9px}.headline{padding-left:18px}.headline h1{font-size:24px}.medicine strong{font-size:16px}.medicine .copy span{font-size:13px}}@media(min-width:700px){body{padding:35px 0}.site{border-radius:30px;overflow:hidden;min-height:850px}nav{bottom:0;border-radius:0 0 30px 30px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="site">
    <header><svg class="brand-mark" viewBox="0 0 56 70" aria-hidden="true"><defs><linearGradient id="dropGradient" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00aaa4"/><stop offset="1" stop-color="#0654d8"/></linearGradient></defs><path fill="url(#dropGradient)" d="M29 1C24 11 5 30 5 46a23 23 0 0 0 34 20C22 65 17 53 22 42c4-10 17-21 20-29C37 7 32 2 29 1Z"/><path fill="#0854ce" d="M43 24c2 10-13 23-13 32 0 7 6 12 13 9 9-4 14-13 12-22-2-7-8-16-12-19Z"/></svg><div><div class="brand-name">My Drops</div><div class="tagline">Your eye medicines, made clearer.</div></div></header>
    <main id="app" aria-live="polite"></main>
    <nav aria-label="Main navigation">
      <button data-route="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/></svg>Home</button>
      <button data-route="learn" aria-label="Learn"><svg viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v15"/></svg>Learn</button>
      <button data-route="timeline" aria-label="Journey"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 7h11M5 14h15"/><circle cx="5" cy="7" r="2"/><circle cx="5" cy="14" r="2"/></svg>Journey</button>
      <button data-route="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
    </nav>
  </div>
  <script>
  (()=>{
    const initial=[
      {id:'cosopt',name:'Cosopt®',ingredient:'Dorzolamide + Timolol',type:'Eye drops',dose:'1 drop twice daily',kind:'blue',status:'current'},
      {id:'latanoprost',name:'Latanoprost',ingredient:'',type:'Eye drops',dose:'1 drop at night',kind:'teal',status:'current'},
      {id:'amlodipine',name:'Amlodipine',ingredient:'',type:'5 mg tablets',dose:'1 tablet daily',kind:'pill',status:'current'},
      {id:'metformin',name:'Metformin',ingredient:'',type:'500 mg tablets',dose:'1 tablet twice daily',kind:'pill',status:'current'},
      {id:'timolol',name:'Timolol 0.5%',ingredient:'',type:'Eye drops',dose:'1 drop twice daily',kind:'blue',status:'past'}
    ];
    const timeline=[['Jan 2024','Timolol 0.5% started','1 drop twice daily','Raised eye pressure'],['Mar 2025','Changed to Cosopt®','1 drop twice daily','Eye pressure remained above target'],['Sep 2025','Dose continued','1 drop twice daily','Following ophthalmology review'],['Jan 2026','Patient confirms still using','1 drop twice daily','Patient report']];
    const load=(key,fallback)=>{try{const data=JSON.parse(localStorage.getItem(key));return Array.isArray(data)?data:fallback}catch{return fallback}};
    let meds=load('mydrops.medicines',initial),notes=load('mydrops.notes',[]),route='home',filter='current',tab='overview',selected='cosopt',zoom=1;
    const app=document.getElementById('app');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const bottle=(color='blue',large=false,label='')=>`<svg class="bottle${large?' large':''}" viewBox="0 0 120 180" role="img" aria-label="${esc(label||'Eye drop bottle illustration')}"><defs><linearGradient id="cap-${color}" x1="0" x2="1"><stop stop-color="#03479c"/><stop offset=".5" stop-color="${color==='teal'?'#00a9b0':'#087cf1'}"/><stop offset="1" stop-color="#0050ad"/></linearGradient><linearGradient id="body-${color}" x1="0" x2="1"><stop stop-color="#d2dce4"/><stop offset=".35" stop-color="#fff"/><stop offset=".8" stop-color="#f5f8fa"/><stop offset="1" stop-color="#adbac7"/></linearGradient></defs><path d="M48 12h24l4 39H44z" fill="url(#cap-${color})"/><path d="M31 48q0-6 6-6h46q6 0 6 6v27H31z" fill="url(#cap-${color})"/><path d="M37 74h46q8 0 9 9l4 70q1 14-13 15H37q-14-1-13-15l4-70q1-9 9-9" fill="url(#body-${color})" stroke="#a6bbc9" stroke-width="2"/><path d="M29 89h62v55H29z" fill="#fff" stroke="#cbd9e4"/><path d="M29 89h62v6H29zm0 49h62v6H29z" fill="${color==='teal'?'#00a4b3':'#0874df'}"/><text x="60" y="113" text-anchor="middle" fill="#102765" font-size="${large?12:11}" font-family="Arial" font-weight="bold">${esc(label||'EYE DROPS')}</text><text x="60" y="128" text-anchor="middle" fill="#3b5991" font-size="7" font-family="Arial">Eye drops</text></svg>`;
    const heading=(title,sub,back=false)=>`${back?'<button class="back" data-action="back"><span>‹</span> Back</button>':''}<div class="headline"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>`;
    const note='<div class="notice">Illustrative sample information. Check your own prescription and ask a clinician or pharmacist about your medicines.</div>';
    function home(){const list=meds.filter(m=>m.status===filter);return `${heading('Hello, Mrs Smith','Here are your medicines')}${note}<div class="segmented" role="tablist"><button data-filter="current" role="tab" aria-selected="${filter==='current'}">Current medicines</button><button data-filter="past" role="tab" aria-selected="${filter==='past'}">Past medicines</button></div><div class="stack">${list.length?list.map(m=>`<button class="card medicine ${m.id==='cosopt'?'featured':''}" data-med="${esc(m.id)}">${m.kind==='pill'?'<span class="pill-icon" aria-hidden="true">💊</span>':bottle(m.kind,false,m.name)}<span class="copy"><strong>${esc(m.name)}</strong>${m.ingredient?`<span>${esc(m.ingredient)}</span>`:''}<span>${esc(m.type)}</span><span>${esc(m.dose)}</span></span><span class="chevron" aria-hidden="true">›</span></button>`).join(''):'<div class="card empty">No medicines in this list yet.</div>'}<button class="add" data-route="add">＋ Add a medicine</button></div>`}
    function detail(){const m=meds.find(x=>x.id===selected)||meds[0];if(!m)return home();return `${heading('', '',true)}<div class="detail-head">${m.kind==='pill'?'<span class="pill-icon">💊</span>':bottle(m.kind,false,m.name)}<div><h1>${esc(m.name)}</h1><p>${esc(m.ingredient||m.type)}<br>${m.ingredient?esc(m.type):''}</p><span class="badge">✓ ${m.status==='current'?'Current medicine':'Past medicine'}</span></div></div><div class="tabs" role="tablist">${[['overview','Overview'],['use','How to use'],['effects','Side effects']].map(([id,label])=>`<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</div>${tab==='overview'?`${info('◉','What is this medicine for?',m.id==='cosopt'?'Cosopt is used to lower eye pressure in conditions such as glaucoma or ocular hypertension.':'Your clinician or pharmacist can explain why this medicine was prescribed for you.')}${info('⚙','How does it work?',m.id==='cosopt'?'Cosopt contains two medicines that work together to reduce fluid production in the eye, lowering eye pressure.':'See the patient information leaflet for the mechanism and details of this medicine.')}${info('●','How do I use it?',esc(m.dose)+'. Follow your own prescription and the supplied patient leaflet.')}`:tab==='use'?`${info('●','Your recorded schedule',esc(m.dose))}${info('✓','Before and after use','Wash your hands. Follow the instructions on your prescription and the patient leaflet.')}${info('◎','Need a bigger view?','Open the magnified medicine view below.')}`:`${info('!','Possible side effects','Refer to the official patient information leaflet supplied with your medicine. Ask a pharmacist or clinician if you have concerns.')}${info('☎','Urgent symptoms','Seek urgent medical help for a severe allergic reaction, sudden vision loss, or other serious symptoms.')}`}<div class="action-row"><button class="secondary" data-route="magnify">⌕ Bigger view</button><button class="secondary" data-action="speak">◖ Read aloud</button></div><p class="disclaimer">This demonstration is not a substitute for your prescription or the medicine leaflet. The sample regimen may not apply to you.</p>`}
    function info(icon,title,body){return `<section class="card info"><span class="info-icon" aria-hidden="true">${icon}</span><div><h2>${title}</h2><p>${body}</p></div></section>`}
    function magnify(){const m=meds.find(x=>x.id===selected)||meds[0];return `${heading('Bigger view','Enlarge the label and hear the medicine name.',true)}<div class="hero-bottle zoom-output" style="--zoom:${zoom}">${m.kind==='pill'?'<span style="font-size:130px">💊</span>':bottle(m.kind,true,m.name)}</div><div class="zoom"><button class="secondary" data-action="zoomout" aria-label="Zoom out">−</button><button class="secondary" data-action="zoomin" aria-label="Zoom in">＋</button></div><div class="card read-box"><button class="round" data-action="speak" aria-label="Read medicine information aloud">◖</button><div><strong>Read aloud name and instructions</strong><p>Hear the information in a clear voice.</p></div></div><p class="disclaimer">Bottle illustration is for demonstration and is not a photograph of your medicine.</p>`}
    function journey(){return `${heading('My Medication Journey','See how treatment has changed over time.')}${note}<div class="timeline">${timeline.map(([date,title,dose,reason])=>`<article class="card event"><time>${date}</time><h2>${title}</h2><p>${dose}</p><div class="reason"><b>Reason</b><span>${reason}</span></div></article>`).join('')}${notes.map(n=>`<article class="card event"><time>${esc(n.date)}</time><h2>Personal note</h2><p>${esc(n.text)}</p><div class="reason"><b>Source</b><span>Saved on this device</span></div></article>`).join('')}</div><button class="add" data-route="note">＋ Add a note</button>`}
    function learn(){return `${heading('Understand your drops','Information that is easier to read and hear.')}${info('◉','Your medicines','Tap a medicine on the Home screen to see its overview and recorded schedule.')}${info('⌕','Bigger view','Enlarge the illustration with the plus and minus buttons.')}${info('◖','Read aloud','Use your device’s built-in speech voice to hear the name and recorded schedule.')}${info('↗','Your journey','Review an example of treatment changes over time.')}<p class="disclaimer">This is a prototype with illustrative medicine data, not a clinical reference.</p>`}
    function settings(){return `${heading('Settings','About this demonstration.')}${info('◉','Sample profile','The name and example treatment history shown here are fictional.')}${info('▣','Saved on this device','Medicines and notes you add stay in this browser’s local storage. They are not sent to a server and may disappear if browser data is cleared.')}${info('◖','Audio support','The read aloud feature uses your browser’s speech synthesis when available.')}<button class="secondary" data-action="reset">Reset sample data</button>`}
    function form(kind){return `${heading(kind==='add'?'Add a medicine':'Add a note',kind==='add'?'Keep a simple record on this device.':'Add a personal note to your journey.',true)}<form class="card form" id="entry-form" data-kind="${kind}">${kind==='add'?'<label>Medicine name<input name="name" maxlength="70" required autocomplete="off"></label><label>Type or strength<input name="type" maxlength="80" required autocomplete="off"></label><label>Recorded schedule<input name="dose" maxlength="100" required autocomplete="off"></label><label>Status<select name="status" style="font:inherit;padding:11px;border:1px solid #bcd8e8;border-radius:10px;background:white"><option value="current">Current</option><option value="past">Past</option></select></label>':'<label>Note<textarea name="text" maxlength="400" required></textarea></label>'}<button class="primary" type="submit">Save ${kind==='add'?'medicine':'note'}</button><p class="helper">Stored only in this browser. Do not use this prototype as your sole medication record.</p></form>`}
    function render(){const views={home,detail,magnify,timeline:journey,learn,settings,add:()=>form('add'),note:()=>form('note')};app.innerHTML=(views[route]||home)();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.route===route?'page':'false'));window.scrollTo({top:0,behavior:'instant'})}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){route=b.dataset.route;render();return}if(b.dataset.med){selected=b.dataset.med;tab='overview';route='detail';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.action==='back'){route=route==='magnify'?'detail':route==='note'?'timeline':'home';render()}if(b.dataset.action==='zoomin'||b.dataset.action==='zoomout'){zoom=Math.max(.8,Math.min(1.55,zoom+(b.dataset.action==='zoomin'?.15:-.15)));render()}if(b.dataset.action==='speak'){const m=meds.find(x=>x.id===selected);if('speechSynthesis'in window&&m){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(`${m.name}. ${m.type}. Recorded schedule: ${m.dose}. Follow your own prescription.`);utterance.lang='en-GB';utterance.rate=.85;speechSynthesis.speak(utterance)}else alert('Read aloud is unavailable in this browser.')}if(b.dataset.action==='reset'){if(confirm('Reset added medicines and notes on this device?')){localStorage.removeItem('mydrops.medicines');localStorage.removeItem('mydrops.notes');meds=initial;notes=[];route='home';render()}}});
    document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);if(e.target.dataset.kind==='add'){meds.push({id:'user-'+Date.now(),name:String(data.get('name')).trim(),ingredient:'',type:String(data.get('type')).trim(),dose:String(data.get('dose')).trim(),kind:'blue',status:String(data.get('status'))});localStorage.setItem('mydrops.medicines',JSON.stringify(meds));filter=String(data.get('status'));route='home'}else{notes.push({date:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date()),text:String(data.get('text')).trim()});localStorage.setItem('mydrops.notes',JSON.stringify(notes));route='timeline'}render()});
    render();
  })();
  </script>
</body>
</html>
