    function home(){const list=meds.filter(m=>m.status===filter);return `${heading('Hello, Mrs Smith','Here are your medicines')}${note}<p class="eyedrop-count">3 eye drops in this example</p><div class="segmented" role="tablist"><button data-filter="current" role="tab" aria-selected="${filter==='current'}">Current medicines</button><button data-filter="past" role="tab" aria-selected="${filter==='past'}">Past medicines</button></div><div class="stack">${list.length?list.map(m=>`<button class="card medicine ${m.id==='dorzolamide'?'featured':''}" data-med="${esc(m.id)}">${m.kind==='pill'?'<span class="pill-icon" aria-hidden="true">💊</span>':medicineVisual(m)}<span class="copy"><strong>${esc(m.name)}</strong>${m.ingredient?`<span>${esc(m.ingredient)}</span>`:''}<span>${esc(m.type)}</span><span>${esc(m.dose)}</span>${m.expiry?`<span class="expiry-line">Expiry: ${esc(m.expiry)}</span>`:''}</span><span class="chevron" aria-hidden="true">›</span></button>`).join(''):'<div class="card empty">No medicines in this list yet.</div>'}<button class="add" data-route="add">＋ Add a medicine</button></div>`}
    function detail(){const m=meds.find(x=>x.id===selected)||meds[0];if(!m)return home();const f=medicineFacts[m.id];return `${heading('', '',true)}<div class="detail-head">${m.kind==='pill'?'<span class="pill-icon">💊</span>':medicineVisual(m)}<div><h1>${esc(m.name)}</h1><p>${esc(m.ingredient||m.type)}<br>${m.ingredient?esc(m.type):''}</p><span class="badge">✓ ${m.status==='current'?'Current medicine':'Past medicine'}</span></div></div><div class="action-row quick-actions"><button class="secondary" data-route="magnify">⌕ Bigger view</button><button class="secondary" data-action="speak">◖ Read aloud</button></div><section class="card voice-panel"><h2>Record a voice note</h2><p>Record on this device, then choose an app to send it or save the audio file. No recording is uploaded automatically.</p><div class="voice-controls"><button class="primary" data-action="record-start">● Record</button><button class="secondary" data-action="record-stop" disabled>■ Stop</button><button class="secondary" data-action="record-share" disabled>↗ Send / save</button></div><p class="voice-status" role="status" aria-live="polite">Ready to record.</p></section><div class="tabs" role="tablist">${[['overview','Overview'],['use','How to use'],['effects','Side effects']].map(([id,label])=>`<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</div>${tab==='overview'?`${info('◉','What is this medicine for?',esc(f?.purpose||'Ask your clinician or pharmacist why this medicine was prescribed for you.'))}${info('⚙','How does it work?',esc(f?.how||'See your medicine leaflet for details.'))}${info('●','How do I use it?',esc(f?.use||m.dose+'. Follow your own prescription and leaflet.'))}`:tab==='use'?`${info('●','Your recorded schedule',f?`${esc(m.eye)} · 1 drop · ${esc(m.times.join(' — '))}. Example record: confirm with your own prescription.`:esc(m.dose))}${info('✓','Before and after use',esc(f?.after||'Wash your hands. Follow your prescription and the patient leaflet.'))}`:`${info('!','Possible side effects',esc(f?.effects||'Read the patient information leaflet supplied with your medicine.'))}${info('☎','Urgent symptoms',esc(f?.urgent||'Seek medical advice promptly for serious or concerning symptoms.'))}`}<section class="card expiry-card"><h2>Expiry date</h2><p>${m.expiry?`Recorded pack expiry: ${esc(m.expiry)}.`:'No expiry date recorded. Check your own medicine pack.'} Enter the month and year printed on your pack.</p><form id="expiry-form"><label>Month and year<input type="month" name="expiry" value="${esc(m.expiry||'')}" required></label><button class="secondary" type="submit">Save</button></form></section><p class="disclaimer">Information in this example is not an individual prescription. Verify the medicine, treated eye, dose and times with a clinician or pharmacist before use.</p>`}
    function info(icon,title,body){return `<section class="card info"><span class="info-icon" aria-hidden="true">${icon}</span><div><h2>${title}</h2><p>${body}</p></div></section>`}
    function magnify(){const m=meds.find(x=>x.id===selected)||meds[0];return `${heading('Bigger view','Enlarge the label and hear the medicine name.',true)}<div class="hero-bottle zoom-output" style="--zoom:${zoom}">${m.kind==='pill'?'<span style="font-size:130px">💊</span>':medicineVisual(m,true)}</div><div class="zoom"><button class="secondary" data-action="zoomout" aria-label="Zoom out">−</button><button class="secondary" data-action="zoomin" aria-label="Zoom in">＋</button></div><div class="card read-box"><button class="round" data-action="speak" aria-label="Read medicine information aloud">◖</button><div><strong>Read aloud name and instructions</strong><p>Hear the information in a clear voice.</p></div></div><p class="disclaimer">Check the label on your own medicine pack. This photograph is illustrative.</p>`}
    function journey(){return `${heading('My Medication Journey','Keep personal notes about your treatment.')}${note}<div class="timeline">${notes.length?notes.map(n=>`<article class="card event"><time>${esc(n.date)}</time><h2>Personal note</h2><p>${esc(n.text)}</p><div class="reason"><b>Source</b><span>Saved on this device</span></div></article>`).join(''):'<div class="card empty">No journey notes recorded yet.</div>'}</div><button class="add" data-route="note">＋ Add a note</button>`}
    function schedule(){const current=meds.filter(m=>m.status==='current'),eyeDrops=current.filter(m=>m.type==='Eye drops'),other=current.filter(m=>m.type!=='Eye drops');const card=m=>`<section class="card schedule-item"><h2>${esc(m.name)}</h2><p>${m.eye?`${esc(m.eye)} · 1 drop` : esc(m.dose)}</p>${m.times?`<div class="time-chips">${m.times.map(t=>`<time>${esc(t)}</time>`).join('')}</div>`:''}<p class="expiry-line">Expiry: ${m.expiry?esc(m.expiry):'Not recorded'}</p></section>`;return `${heading('Medication schedule','Example entries from the supplied draft.')}${note}<h2 class="schedule-group">Eye drops (${eyeDrops.length})</h2><div class="schedule-list">${eyeDrops.map(card).join('')}</div>${other.length?`<h2 class="schedule-group">Other medicines</h2><div class="schedule-list">${other.map(card).join('')}</div>`:''}<p class="disclaimer">These times are sample records, not instructions to change treatment. Confirm them with your own prescription.</p>`}
    function settings(){return `${heading('Settings','About this demonstration.')}${info('◉','Sample profile','The displayed name and medicine schedule are illustrative; confirm all entries against your own prescription.')}${info('▣','Saved on this device','Medicines and notes you add stay in this browser’s local storage. They are not sent to a server and may disappear if browser data is cleared.')}${info('◖','Audio support','Read aloud uses your browser’s speech voice. Voice notes need microphone access and stay in memory until you choose to send or save them.')}<p class="disclaimer">Version ${APP_VERSION}</p><button class="secondary" data-action="reset">Reset sample data</button>`}
    function form(kind){return `${heading(kind==='add'?'Add a medicine':'Add a note',kind==='add'?'Keep a simple record on this device.':'Add a personal note to your journey.',true)}<form class="card form" id="entry-form" data-kind="${kind}">${kind==='add'?'<label>Medicine name<input name="name" maxlength="70" required autocomplete="off"></label><label>Type or strength<input name="type" maxlength="80" required autocomplete="off"></label><label>Recorded schedule<input name="dose" maxlength="100" required autocomplete="off"></label><label>Expiry month (optional)<input type="month" name="expiry"></label><label>Status<select name="status" style="font:inherit;padding:11px;border:1px solid #bcd8e8;border-radius:10px;background:white"><option value="current">Current</option><option value="past">Past</option></select></label>':'<label>Note<textarea name="text" maxlength="400" required></textarea></label>'}<button class="primary" type="submit">Save ${kind==='add'?'medicine':'note'}</button><p class="helper">Stored only in this browser. Do not use this prototype as your sole medication record.</p></form>`}
    function render(){const views={home,detail,magnify,timeline:journey,schedule,settings,add:()=>form('add'),note:()=>form('note')};app.innerHTML=(views[route]||home)();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.route===route?'page':'false'));if(route==='detail'&&recordingBlob)voiceState('Recording ready to send or save.',false,true);if(route==='detail'&&recorder?.state==='recording')voiceState('Recording… tap Stop when finished.',true);window.scrollTo({top:0,behavior:'instant'})}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){route=b.dataset.route;render();return}if(b.dataset.med){selected=b.dataset.med;tab='overview';route='detail';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.action==='back'){route=route==='magnify'?'detail':route==='note'?'timeline':'home';render()}if(b.dataset.action==='zoomin'||b.dataset.action==='zoomout'){zoom=Math.max(.8,Math.min(1.55,zoom+(b.dataset.action==='zoomin'?.15:-.15)));render()}if(b.dataset.action==='speak'){const m=meds.find(x=>x.id===selected);if('speechSynthesis'in window&&m){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(`${m.name}. ${m.type}. Recorded schedule: ${m.dose}. Follow your own prescription.`);utterance.lang='en-GB';utterance.rate=.85;speechSynthesis.speak(utterance)}else alert('Read aloud is unavailable in this browser.')}if(b.dataset.action==='reset'){if(confirm('Reset added medicines and notes on this device?')){localStorage.removeItem('mydrops.medicines');localStorage.removeItem('mydrops.notes');meds=initial.map(m=>({...m}));notes=[];route='home';render()}}});
    document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);if(e.target.dataset.kind==='add'){meds.push({id:'user-'+Date.now(),name:String(data.get('name')).trim(),ingredient:'',type:String(data.get('type')).trim(),dose:String(data.get('dose')).trim(),expiry:String(data.get('expiry')||''),kind:'blue',status:String(data.get('status'))});localStorage.setItem('mydrops.medicines',JSON.stringify(meds));filter=String(data.get('status'));route='home'}else{notes.push({date:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date()),text:String(data.get('text')).trim()});localStorage.setItem('mydrops.notes',JSON.stringify(notes));route='timeline'}render()});

    let recorder=null,recordingChunks=[],recordingBlob=null,recordingStream=null;
    const voiceState=(message,recording=false,ready=false)=>{const panel=app.querySelector('.voice-panel');if(!panel)return;panel.querySelector('.voice-status').textContent=message;panel.querySelector('[data-action="record-start"]').disabled=recording;panel.querySelector('[data-action="record-stop"]').disabled=!recording;panel.querySelector('[data-action="record-share"]').disabled=!ready};
    document.addEventListener('click',async e=>{const action=e.target.closest('button')?.dataset.action;if(action==='record-start'){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){voiceState('Recording is unavailable in this browser.');return}try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recordingChunks=[];recordingBlob=null;recorder=new MediaRecorder(recordingStream);recorder.ondataavailable=ev=>{if(ev.data.size)recordingChunks.push(ev.data)};recorder.onstop=()=>{recordingBlob=new Blob(recordingChunks,{type:recorder.mimeType||'audio/webm'});recordingStream.getTracks().forEach(track=>track.stop());recordingStream=null;voiceState(recordingBlob.size?'Recording ready to send or save.':'No audio captured.',false,recordingBlob.size>0)};recorder.start();voiceState('Recording… tap Stop when finished.',true)}catch{voiceState('Microphone access was unavailable. Check your browser permission.')}}if(action==='record-stop'&&recorder?.state==='recording'){recorder.stop();voiceState('Preparing recording…')}if(action==='record-share'&&recordingBlob){const ext=recordingBlob.type.includes('mp4')?'m4a':'webm',file=new File([recordingBlob],`MyDrops-voice-note.${ext}`,{type:recordingBlob.type});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'My Drops voice note'});voiceState('Share sheet closed. You choose the recipient.',false,true);return}}catch(err){if(err.name==='AbortError'){voiceState('Sharing cancelled. The recording is still ready.',false,true);return}}const url=URL.createObjectURL(recordingBlob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);voiceState('Audio downloaded. You can attach it in your preferred app.',false,true)}});
    document.addEventListener('submit',e=>{if(e.target.id!=='expiry-form')return;e.preventDefault();const m=meds.find(x=>x.id===selected);if(!m)return;m.expiry=String(new FormData(e.target).get('expiry')||'');localStorage.setItem('mydrops.medicines',JSON.stringify(meds));render()});
    render();
  })();
  </script>
</body>
</html>
